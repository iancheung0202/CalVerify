services:
  web:
    build: .
    command: python main.py
    network_mode: host
    restart: unless-stopped
    environment:
      - MALLOC_ARENA_MAX=2
    volumes:
      - .:/srv/CalVerify

  instagram:
    build: .
    command: python instagram.py
    network_mode: host
    restart: unless-stopped
    volumes:
      - .:/srv/CalVerify
